# Forecast Scoreboard configuration

# Model registry. `scored_variables` are the only variables stored + verified.
# Optional `conda_env`: run this model's forecast step in another conda env
# (run_range shells out via `conda run`); verification always stays in the
# orchestrator's env — it only reads zarr.
models:
  atlas:
    scored_variables: [tp, t2m, u10m, v10m, z500, t850, msl]
    precip_variable: tp
  fuxi:
    scored_variables: [tp06, t2m, u10m, v10m, z500, t850, msl]
    precip_variable: tp06
  aurora:  # precip via chained diagnostics: derived sp/tcwv -> PrecipitationAFNOv2
    scored_variables: [tp06, t2m, u10m, v10m, z500, t850, msl]
    precip_variable: tp06
  graphcast_oper:  # JAX-based, conflicts with the torch/ONNX stack
    scored_variables: [tp06, t2m, u10m, v10m, z500, t850, msl]
    precip_variable: tp06
    conda_env: e2s-graphcast
  aifs:  # anemoi + flash-attn
    scored_variables: [tp06, t2m, u10m, v10m, z500, t850, msl]
    precip_variable: tp06
    conda_env: e2s-aifs
  persistence:  # pipeline testing only — no skill, no GPU
    scored_variables: [tp, t2m, u10m, v10m, z500, t850, msl]
    precip_variable: tp
  fengwu:  # no native precip
    scored_variables: [t2m, u10m, v10m, z500, t850, msl]
  pangu6:  # precip via the same chained diagnostics as aurora
    scored_variables: [tp06, t2m, u10m, v10m, z500, t850, msl]
    precip_variable: tp06
  sfno:  # no native precip
    scored_variables: [t2m, u10m, v10m, z500, t850, msl]
  fcn3:  # no native precip; deterministic single member
    scored_variables: [t2m, u10m, v10m, z500, t850, msl]

forecast:
  nsteps: 20            # 20 x 6h = 5 days

verification:
  state_variables: [t2m, u10m, v10m, z500, t850, msl]
  precip_thresholds_mm: [1.0, 5.0, 10.0]   # per 6 h accumulation
  fss_window_cells: 9                       # 9 x 0.25 deg ~ 250 km neighborhood
  compute_acc: true                         # needs WB2 climatology download
  regions:
    global: [-90.0, 90.0]
    nh_extratropics: [20.0, 90.0]
    tropics: [-20.0, 20.0]
    sh_extratropics: [-90.0, -20.0]

# scoreboard/sweep.py deletes forecast zarrs whose files are older than this
# (by mtime) and whose scores are already in metrics.parquet.
retention_days: 30

# Init times older than this are the "historic" regime (ERA5 init + truth);
# younger inits are "real-time" (GFS init, GFS-analysis truth, provisional).
# The boundary encodes ERA5 availability in ARCO, whose publication lag is
# ~3 months (e2s currently caps requests at 2026-04-30) — NOT the ~6 days
# originally assumed. Lower this only after checking ARCO's actual lag.
historic_cutoff_days: 120

# Presentation layer — the single source of truth for anything a page draws.
# `publish.py` injects `models` into docs/index.html (both the `const MODELS`
# array and the generated <style id="model-colors"> block); `export.py` emits it
# as docs/data/models.json for compare.html and map.html. Do not hardcode model
# colours or labels in a page.
display:
  # Order is the legend/draw order on the charts — not config's `models:` order.
  # `css_var` names are kept as they were in the hand-written stylesheet so the
  # JS `cvar` lookups keep working.
  models:
    - {id: aurora,         label: Aurora,      css_var: --s-aurora,    color: "#2a78d6", color_dark: "#3987e5", width: 2}
    - {id: fuxi,           label: FuXi,        css_var: --s-fuxi,      color: "#008300", color_dark: "#008300", width: 2}
    - {id: atlas,          label: Atlas,       css_var: --s-atlas,     color: "#e87ba4", color_dark: "#d55181", width: 2}
    - {id: persistence,    label: Persistence, css_var: --s-ref,       color: "#848d9b", color_dark: "#7d8694", width: 1.5,
       short: "Persist.", baseline: true}
    - {id: fengwu,         label: FengWu,      css_var: --s-fengwu,    color: "#eda100", color_dark: "#c98500", width: 2}
    - {id: pangu6,         label: Pangu,       css_var: --s-pangu6,    color: "#4a3aa7", color_dark: "#9085e9", width: 2}
    - {id: sfno,           label: SFNO,        css_var: --s-sfno,      color: "#eb6834", color_dark: "#d95926", width: 2}
    - {id: fcn3,           label: FCN3,        css_var: --s-fcn3,      color: "#1baf7a", color_dark: "#199e70", width: 2}
    - {id: graphcast_oper, label: GraphCast,   css_var: --s-graphcast, color: "#b23bbf", color_dark: "#c46cd0", width: 2,
       short: "GraphC."}
    - {id: aifs,           label: AIFS,        css_var: --s-aifs,      color: "#96751a", color_dark: "#a8892c", width: 2}

  # Sampling points for compare.html (EXPLORER_STEPS.md E2). Chosen for global
  # coverage across all four verification regions rather than by population
  # alone — the tropics and SH extratropics need enough points to be more than
  # anecdote, since that is where the models differ most.
  cities:
    - {name: Tokyo,          lat:  35.68, lon:  139.69}
    - {name: Delhi,          lat:  28.61, lon:   77.21}
    - {name: Shanghai,       lat:  31.23, lon:  121.47}
    - {name: Dhaka,          lat:  23.81, lon:   90.41}
    - {name: São Paulo,      lat: -23.55, lon:  -46.63}
    - {name: Cairo,          lat:  30.04, lon:   31.24}
    - {name: Mexico City,    lat:  19.43, lon:  -99.13}
    - {name: Beijing,        lat:  39.90, lon:  116.41}
    - {name: Mumbai,         lat:  19.08, lon:   72.88}
    - {name: New York,       lat:  40.71, lon:  -74.01}
    - {name: Karachi,        lat:  24.86, lon:   67.01}
    - {name: Buenos Aires,   lat: -34.60, lon:  -58.38}
    - {name: Istanbul,       lat:  41.01, lon:   28.98}
    - {name: Kolkata,        lat:  22.57, lon:   88.36}
    - {name: Manila,         lat:  14.60, lon:  120.98}
    - {name: Lagos,          lat:   6.52, lon:    3.38}
    - {name: Rio de Janeiro, lat: -22.91, lon:  -43.17}
    - {name: Moscow,         lat:  55.76, lon:   37.62}
    - {name: Paris,          lat:  48.86, lon:    2.35}
    - {name: London,         lat:  51.51, lon:   -0.13}
    - {name: Jakarta,        lat:  -6.21, lon:  106.85}
    - {name: Lima,           lat: -12.05, lon:  -77.04}
    - {name: Bangkok,        lat:  13.76, lon:  100.50}
    - {name: Seoul,          lat:  37.57, lon:  126.98}
    - {name: Los Angeles,    lat:  34.05, lon: -118.24}
    - {name: Tehran,         lat:  35.69, lon:   51.39}
    - {name: Kinshasa,       lat:  -4.44, lon:   15.27}
    - {name: Johannesburg,   lat: -26.20, lon:   28.05}
    - {name: Sydney,         lat: -33.87, lon:  151.21}
    - {name: Chicago,        lat:  41.88, lon:  -87.63}
    - {name: Nairobi,        lat:  -1.29, lon:   36.82}
    - {name: Singapore,      lat:   1.35, lon:  103.82}

  # map.html field export (EXPLORER_STEPS.md E4). t2m only for now — see
  # PLAN_EXPLORER.md §5a for why precipitation is deliberately not first.
  # Start at 1.0 deg for fast iteration, then raise to 0.5.
  map_variables: [t2m]
  map_leads: [24, 48, 72, 96, 120]
  map_resolution_deg: 1.0

  # Which colour ramp each variable's *forecast* field is drawn with. Error
  # fields ignore this entirely and always use the diverging ramp pinned at
  # zero — sign is the only thing an error map exists to show.
  #
  # Ramp names are defined in docs/lib/js/colormap.js, which also documents why
  # a variable earns a ramp other than the viridis default: it takes a genuine
  # pre-existing reader convention (cold is blue, dry is white) to beat a
  # perceptually uniform ramp. Anything not listed here gets viridis.
  map_palettes:
    t2m:   temperature
    t850:  temperature
    tp06:  precip
    u10m:  wind
    v10m:  wind

  # Street cartography for map.html: roads, towns, water. Off at global zooms,
  # switched on automatically past `basemap_zoom` — a 1 deg field has nothing to
  # say at street scale, so this is orientation for a reader who has already
  # zoomed in to ask "where exactly is this", not a second data layer.
  #
  # These are WMS endpoints rather than the usual {z}/{x}/{y} tile services, and
  # that is forced rather than chosen. The map's CRS is EPSG:4326 (see
  # docs/lib/js/map.js) while every CDN raster basemap — CARTO, OSM's own,
  # Stamen — is pre-rendered in Web Mercator, and a projected raster cannot be
  # reprojected in the browser. Using one would mean moving the map to
  # EPSG:3857, which truncates at ±85.05° and would cut Antarctica and most of
  # the Arctic off a *global weather* map. A WMS renders per request in whatever
  # CRS the request names, so it costs a slower tile and keeps the poles.
  #
  # `over: true` means the layer is transparent and is drawn *above* the field,
  # which is why it is first: labels and roads over a full-strength field beat
  # a full basemap with the field faded down to see through it. The opaque ones
  # are drawn beneath and dim the field to `field_opacity`.
  #
  # Adding an entry is all it takes to add a button; the page builds the control
  # from this list. Attribution is mandatory — it is rendered as a chip on the
  # map whenever a layer is on, and these services are used on their terms.
  map:
    max_zoom: 10             # was 6; street scale needs the extra levels
    basemap_zoom: 6          # auto-on at and above this zoom, auto-off below
    field_opacity: 0.72      # field alpha while an opaque basemap sits under it
    basemaps:
      - id: labels
        label: Roads
        url: "https://ows.terrestris.de/osm/service"
        layers: OSM-Overlay-WMS
        over: true
        attribution: 'Roads &amp; places &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, rendered by <a href="https://www.terrestris.de/">terrestris</a>'
      - id: streets
        label: Streets
        url: "https://ows.terrestris.de/osm/service"
        layers: OSM-WMS
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, rendered by <a href="https://www.terrestris.de/">terrestris</a>'
      - id: terrain
        label: Terrain
        url: "https://ows.terrestris.de/osm/service"
        layers: TOPO-OSM-WMS
        attribution: 'Terrain &amp; OSM &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, rendered by <a href="https://www.terrestris.de/">terrestris</a>'

paths:
  data: data
  # GitHub Pages serves a branch's root or /docs only — hence "docs", not
  # "site". docs/index.html is the designed page; docs/charts.html is the
  # plain matplotlib one.
  site: docs
