# Forecast Scoreboard configuration

# Model registry. `scored_variables` are the only variables stored + verified.
# Optional `conda_env`: run this model's forecast step in another conda env
# (run_range shells out via `conda run`); verification always stays in the
# orchestrator's env — it only reads zarr.
models:
  atlas:
    scored_variables: [tp, t2m, u10m, v10m, z500, t850, msl]
    precip_variable: tp
  fuxi:
    scored_variables: [tp06, t2m, u10m, v10m, z500, t850, msl]
    precip_variable: tp06
  aurora:  # precip via chained diagnostics: derived sp/tcwv -> PrecipitationAFNOv2
    scored_variables: [tp06, t2m, u10m, v10m, z500, t850, msl]
    precip_variable: tp06
  graphcast_oper:  # JAX-based, conflicts with the torch/ONNX stack
    scored_variables: [tp06, t2m, u10m, v10m, z500, t850, msl]
    precip_variable: tp06
    conda_env: e2s-graphcast
  aifs:  # anemoi + flash-attn
    scored_variables: [tp06, t2m, u10m, v10m, z500, t850, msl]
    precip_variable: tp06
    conda_env: e2s-aifs
  persistence:  # pipeline testing only — no skill, no GPU
    scored_variables: [tp, t2m, u10m, v10m, z500, t850, msl]
    precip_variable: tp
  fengwu:  # no native precip
    scored_variables: [t2m, u10m, v10m, z500, t850, msl]
  pangu6:  # precip via the same chained diagnostics as aurora
    scored_variables: [tp06, t2m, u10m, v10m, z500, t850, msl]
    precip_variable: tp06
  sfno:  # no native precip
    scored_variables: [t2m, u10m, v10m, z500, t850, msl]
  fcn3:  # no native precip; deterministic single member
    scored_variables: [t2m, u10m, v10m, z500, t850, msl]

forecast:
  nsteps: 20            # 20 x 6h = 5 days

verification:
  state_variables: [t2m, u10m, v10m, z500, t850, msl]
  precip_thresholds_mm: [1.0, 5.0, 10.0]   # per 6 h accumulation
  fss_window_cells: 9                       # 9 x 0.25 deg ~ 250 km neighborhood
  compute_acc: true                         # needs WB2 climatology download
  regions:
    global: [-90.0, 90.0]
    nh_extratropics: [20.0, 90.0]
    tropics: [-20.0, 20.0]
    sh_extratropics: [-90.0, -20.0]

# scoreboard/sweep.py deletes forecast zarrs whose files are older than this
# (by mtime) and whose scores are already in metrics.parquet.
retention_days: 30

# Init times older than this are the "historic" regime (ERA5 init + truth);
# younger inits are "real-time" (GFS init, GFS-analysis truth, provisional).
# The boundary encodes ERA5 availability in ARCO, whose publication lag is
# ~3 months (e2s currently caps requests at 2026-04-30) — NOT the ~6 days
# originally assumed. Lower this only after checking ARCO's actual lag.
historic_cutoff_days: 120

# Presentation layer — the single source of truth for anything a page draws.
# `publish.py` injects `models` into docs/index.html (both the `const MODELS`
# array and the generated <style id="model-colors"> block); `export.py` emits it
# as docs/data/models.json for compare.html and map.html. Do not hardcode model
# colours or labels in a page.
display:
  # Order is the legend/draw order on the charts — not config's `models:` order.
  # `css_var` names are kept as they were in the hand-written stylesheet so the
  # JS `cvar` lookups keep working.
  models:
    - {id: aurora,         label: Aurora,      css_var: --s-aurora,    color: "#2a78d6", color_dark: "#3987e5", width: 2}
    - {id: fuxi,           label: FuXi,        css_var: --s-fuxi,      color: "#008300", color_dark: "#008300", width: 2}
    - {id: atlas,          label: Atlas,       css_var: --s-atlas,     color: "#e87ba4", color_dark: "#d55181", width: 2}
    - {id: persistence,    label: Persistence, css_var: --s-ref,       color: "#848d9b", color_dark: "#7d8694", width: 1.5,
       short: "Persist.", baseline: true}
    - {id: fengwu,         label: FengWu,      css_var: --s-fengwu,    color: "#eda100", color_dark: "#c98500", width: 2}
    - {id: pangu6,         label: Pangu,       css_var: --s-pangu6,    color: "#4a3aa7", color_dark: "#9085e9", width: 2}
    - {id: sfno,           label: SFNO,        css_var: --s-sfno,      color: "#eb6834", color_dark: "#d95926", width: 2}
    - {id: fcn3,           label: FCN3,        css_var: --s-fcn3,      color: "#1baf7a", color_dark: "#199e70", width: 2}
    - {id: graphcast_oper, label: GraphCast,   css_var: --s-graphcast, color: "#b23bbf", color_dark: "#c46cd0", width: 2,
       short: "GraphC."}
    - {id: aifs,           label: AIFS,        css_var: --s-aifs,      color: "#96751a", color_dark: "#a8892c", width: 2}

  # Sampling points for compare.html (EXPLORER_STEPS.md E2). Chosen for global
  # coverage across all four verification regions rather than by population
  # alone — the tropics and SH extratropics need enough points to be more than
  # anecdote, since that is where the models differ most.
  cities:
    - {name: Tokyo,          lat:  35.68, lon:  139.69}
    - {name: Delhi,          lat:  28.61, lon:   77.21}
