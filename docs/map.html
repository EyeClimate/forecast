<meta charset="utf-8">
<title>Forecast Map — AI Weather Model Verification</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="lib/vendor/leaflet.css">
<link rel="stylesheet" href="lib/css/site.css">
<style id="model-colors">
/* generated from config.yaml `display.models` by scoreboard/publish.py */
:root {
  --s-aurora: #2a78d6;
  --s-fuxi: #008300;
  --s-atlas: #e87ba4;
  --s-ref: #848d9b;
  --s-fengwu: #eda100;
  --s-pangu6: #4a3aa7;
  --s-sfno: #eb6834;
  --s-fcn3: #1baf7a;
  --s-graphcast: #b23bbf;
  --s-aifs: #96751a;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    --s-aurora: #3987e5;
    --s-fuxi: #008300;
    --s-atlas: #d55181;
    --s-ref: #7d8694;
    --s-fengwu: #c98500;
    --s-pangu6: #9085e9;
    --s-sfno: #d95926;
    --s-fcn3: #199e70;
    --s-graphcast: #c46cd0;
    --s-aifs: #a8892c;
  }
}
:root[data-theme="dark"] {
  --s-aurora: #3987e5;
  --s-fuxi: #008300;
  --s-atlas: #d55181;
  --s-ref: #7d8694;
  --s-fengwu: #c98500;
  --s-pangu6: #9085e9;
  --s-sfno: #d95926;
  --s-fcn3: #199e70;
  --s-graphcast: #c46cd0;
  --s-aifs: #a8892c;
}
</style>
<style>
/* ---------- full-bleed map shell ----------
   The map is the page, not a figure inside one: everything else floats over it.
   That is the whole difference between "a site with a map on it" and a map
   application, and it is why the controls are a panel rather than a form. */
html, body { height: 100%; margin: 0; overflow: hidden; }
.app { position: fixed; inset: 0; display: flex; flex-direction: column; }

.maprow { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr; }
.maprow.two { grid-template-columns: 1fr 1fr; gap: 2px; background: var(--border); }
.pane { position: relative; overflow: hidden; }
.leafletmap { position: absolute; inset: 0; background: var(--page); }
.leaflet-container { background: var(--page); font: inherit; }
/* Geography weight order: coast > border > graticule. All three are drawn over
   a saturated field with nothing behind them, so weight is the only thing
   separating them — if the graticule reads as strongly as the coastline, the
   land/sea edge stops being findable at a glance. */
.coast { fill: none; stroke: var(--ink); stroke-width: .9; opacity: .55; }
.border { fill: none; stroke: var(--ink); stroke-width: .6; opacity: .3;
  stroke-dasharray: 4 3; }
.grat { fill: none; stroke: var(--ink); stroke-width: .5; opacity: .12; }

/* City markers sit directly on the field, so the name needs a halo: paint-order
   puts the stroke behind the fill, giving an outline that keeps the glyph
   readable over both the pale and the dark end of any ramp.

   The icon itself takes no pointer events — it is a zero-size anchor and a wide
   invisible box over the map would eat drags. The dot and the name opt back in,
   because those are the click target. */
.citylabel { pointer-events: none; }
.citylabel .dot, .citylabel span { pointer-events: auto; cursor: pointer; }
.citylabel span {
  position: absolute; left: 9px; top: -8px; white-space: nowrap;
  font-size: 11px; font-weight: 650; letter-spacing: .01em;
  color: var(--ink);
  paint-order: stroke fill;
  -webkit-text-stroke: 2.5px color-mix(in srgb, var(--page) 78%, transparent);
  display: none;                       /* .zoomed turns them on; see below */
}
/* A ring rather than the old 3px pip. These are now the affordance for "this
   place has a per-model series", so they have to look clickable and be big
   enough to hit — 3px was neither. */
.citylabel .dot {
  position: absolute; left: -5px; top: -5px; width: 10px; height: 10px;
  border-radius: 50%; box-sizing: border-box;
  border: 2px solid color-mix(in srgb, var(--page) 82%, transparent);
  background: var(--ink); opacity: .7;
  transition: opacity .12s, transform .12s;
}
.citylabel .dot:hover { opacity: 1; transform: scale(1.25); }
/* Names appear once the reader has zoomed in far enough to be asking "where
   exactly is this", and never under a basemap, which prints its own. */
.leaflet-container.zoomed:not(.basemap-on) .citylabel span { display: block; }

/* ---------- popups ---------- */
.mappop .leaflet-popup-content-wrapper {
  background: color-mix(in srgb, var(--surface) 96%, transparent);
  color: var(--ink); border: 1px solid var(--border); border-radius: 12px;
  box-shadow: var(--shadow); backdrop-filter: blur(10px);
}
.mappop .leaflet-popup-tip {
  background: color-mix(in srgb, var(--surface) 96%, transparent);
  border: 1px solid var(--border);
}
.mappop .leaflet-popup-content { margin: 11px 13px; font: inherit; line-height: 1.4; }
.mappop a.leaflet-popup-close-button { color: var(--muted); }
.pophead b { display: block; font-size: 13.5px; font-weight: 650; }
.pophead span { display: block; font-size: 11px; color: var(--muted); margin-bottom: 7px; }
.poptbl { border-collapse: collapse; width: 100%; font-size: 12.5px; }
.poptbl td { padding: 2px 0; white-space: nowrap; }
.poptbl td.name { padding-right: 12px; }
/* Values and errors are read down the column and compared, so they are
   monospaced and right-aligned — a proportional column of numbers cannot be
   scanned for magnitude. */
.poptbl td.val, .poptbl td.err {
  text-align: right; font-family: var(--mono); font-size: 11.5px;
}
.poptbl td.err { padding-left: 10px; color: var(--muted); }
.poptbl tr.truth td { font-weight: 650; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
.poptbl tr.truth + tr td { padding-top: 5px; }
.poptbl .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
.popfoot { font-size: 11px; color: var(--muted); margin-top: 7px; line-height: 1.45; }
.popfoot a { color: var(--accent-ink); font-weight: 600; text-decoration: none; }
.popfoot a:hover { text-decoration: underline; }

/* Basemap credit. Shown and hidden with the layer that requires it, so it is
   never an empty box at global zoom.

   Page chrome rather than Leaflet's own attribution control, and positioned by
   elimination: the bottom bar owns everything left of right:292px, the control
   panel owns the top right, and the pane labels sit at bottom:92px of each pane.
   That leaves the strip between the bottom bar's right edge and the zoom
   control. check_map_render.js asserts it stays clear of all four.

   That strip is exactly 246px wide (292px of bottom bar less the 46px the zoom
   control occupies), so the width is capped below it rather than left to the
   length of whatever credit string config carries. */
.attrib { right: 52px; bottom: 14px; max-width: 224px; padding: 4px 9px;
  font-size: 10.5px; line-height: 1.35; color: var(--muted); }
.attrib a { color: var(--ink-2); }
.attrib[hidden] { display: none; }

#opacwrap input[type=range] { width: 100%; accent-color: var(--accent); }
#opacval { color: var(--ink-2); font-family: var(--mono); text-transform: none;
  letter-spacing: 0; margin-left: 4px; }

/* floating chrome */
.float { position: absolute; z-index: 1000; background: color-mix(in srgb, var(--surface) 92%, transparent);
  border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow);
  backdrop-filter: blur(10px); }

.topbar { top: 12px; left: 12px; display: flex; align-items: center; gap: 4px; padding: 6px 8px; }
.topbar a { color: var(--ink-2); text-decoration: none; font-weight: 600; font-size: 13px;
  padding: 5px 10px; border-radius: 8px; }
.topbar a.on { background: var(--accent-wash); color: var(--accent-ink); }
.topbar a:hover { color: var(--ink); }
.topbar .brand { font-weight: 700; color: var(--ink); font-size: 13px; padding: 5px 10px 5px 6px;
  border-right: 1px solid var(--border); margin-right: 4px; }

.ctlpanel { top: 12px; right: 12px; width: 268px; max-height: calc(100% - 140px); overflow-y: auto; padding: 14px; }
.ctlpanel h2 { margin: 0 0 12px; font-size: 13px; letter-spacing: .04em; text-transform: uppercase;
  color: var(--muted); font-weight: 700; }
.ctl { margin-bottom: 13px; }
.ctl > label { display: block; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase;
  color: var(--muted); font-weight: 700; margin-bottom: 5px; }
.ctl select { font: inherit; font-size: 13.5px; padding: 7px 9px; border-radius: 8px; width: 100%;
  border: 1px solid var(--border); background: var(--surface); color: var(--ink); }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; }
.tabs button { font: inherit; font-size: 12.5px; cursor: pointer; border: 1px solid var(--border);
  background: var(--surface); color: var(--ink-2); padding: 5px 10px; border-radius: 8px; flex: 1 1 auto; }
.tabs button.on { background: var(--accent-wash); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.prov { font-size: 11.5px; color: var(--muted); line-height: 1.5; border-top: 1px solid var(--border);
  padding-top: 10px; margin-top: 2px; }
.prov span { display: block; }
.prov b { color: var(--ink-2); font-weight: 600; }

.panelbtn { display: none; }
/* Bottom-centre of each pane. The top edge belongs to the nav (left) and the
   control panel (right); at a 1280px viewport in side-by-side each pane is only
   640px, so both a corner-anchored and a top-centred tag still land underneath
   them — the left pane was silently unlabelled. Nothing errors when absolutely
   positioned chrome collides, it just disappears.

   The offset is measured, not fixed at 92px, because the bottom bar's height is
   not a constant: below ~520px it wraps to two and then three rows and grows
   upward until it swallows a label sitting at a fixed offset. map.js publishes
   the bar's height as --barh and updates it from a ResizeObserver. The 64px
   fallback is the bar's height on a wide viewport, so the pre-measurement paint
   lands where the old constant put it. */
.paneltag { position: absolute; bottom: calc(var(--barh, 64px) + 28px);
  left: 50%; transform: translateX(-50%);
  z-index: 900; font-size: 12.5px; font-weight: 600; white-space: nowrap;
  display: flex; align-items: center; gap: 7px; padding: 6px 11px; }
.paneltag .sw { width: 9px; height: 9px; border-radius: 3px; flex: none; }

.bottombar { left: 12px; bottom: 12px; right: 292px; padding: 11px 14px; display: flex;
  align-items: center; gap: 14px; flex-wrap: wrap; }
.bottombar input[type=range] { flex: 1; min-width: 160px; accent-color: var(--accent); }
.leadlabel { font-family: var(--mono); font-size: 12.5px; color: var(--ink); white-space: nowrap; }

/* 210px, not 150: converting to °C put a decimal point on every tick, and five
   of those do not fit in 150px without touching. */
.cbar { display: flex; align-items: center; gap: 9px; }
.cbar .bar { height: 10px; width: 210px; border-radius: 3px; border: 1px solid var(--border); }
.cbar .ticks { display: flex; justify-content: space-between; width: 210px; font-size: 10px;
  color: var(--muted); font-family: var(--mono); }
.cbar .unit { font-size: 11px; color: var(--ink-2); max-width: 190px; }
.readout { font-family: var(--mono); font-size: 12px; color: var(--ink-2); white-space: nowrap; min-width: 150px; }

.notes { position: absolute; z-index: 1000; left: 12px; top: 62px; max-width: 420px; }
.note { font-size: 12.5px; color: var(--ink-2); background: color-mix(in srgb, var(--surface) 94%, transparent);
  border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 0 10px 10px 0;
  padding: 9px 13px; box-shadow: var(--shadow); backdrop-filter: blur(10px); }

/* Fatal-error card. Centred rather than tucked in the .notes stack: if this is
   showing, there is no map behind it to avoid covering. */
.fatal { top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1100;
  max-width: 460px; padding: 20px 24px; text-align: center; }
.fatal h3 { margin: 0 0 8px; font-size: 15px; font-weight: 650; }
.fatal p { margin: 0; font-size: 13px; color: var(--ink-2); }
.fatal code { font-family: var(--mono); font-size: 12px; color: var(--accent-ink); }

@media (max-width: 820px) {
  .ctlpanel { left: 12px; right: 12px; width: auto; top: 62px; max-height: 46%; }
  .ctlpanel[hidden] { display: none; }
  .panelbtn { display: inline-block; }
  .bottombar { right: 12px; }
  .maprow.two { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
  /* The bottom edge is entirely spoken for here: the bar goes full width and
     wraps to two or three rows, swallowing the strip the wide layout uses. The
     nav is no better — it is 516px regardless of viewport, so beside it there is
     nothing left below 780px. That leaves the band directly under the nav.

     It shares that band with the notes stack and, when the reader opens it, the
     control panel — which at this width covers the whole upper map by design,
     notes and pane labels included. So the gate checks this against the nav, the
     bar, the pane labels and the zoom control, and not against those two. */
  .attrib { top: 88px; right: 12px; bottom: auto; max-width: 250px; text-align: right; }
}
</style>

<div class="app">
  <div class="maprow" id="maprow">
    <div class="pane">
      <div class="leafletmap" id="map1"></div>
      <div class="float paneltag" id="t1"></div>
    </div>
    <div class="pane" id="panel2" hidden>
      <div class="leafletmap" id="map2"></div>
      <div class="float paneltag" id="t2"></div>
    </div>
  </div>

  <nav class="float topbar">
    <span class="brand">Forecast Scoreboard</span>
    <a href="index.html">Leaderboard</a>
    <a href="compare.html">Compare</a>
    <a href="map.html" class="on" aria-current="page">Map</a>
    <button class="panelbtn tabs" id="panelbtn" style="margin-left:4px">Layers</button>
  </nav>

  <div class="notes" id="notes"></div>
  <div class="float fatal" id="fatal" hidden></div>

  <aside class="float ctlpanel" id="ctlpanel">
    <h2>Layer</h2>
    <div class="ctl">
      <label for="modelsel">Model</label>
      <select id="modelsel"></select>
    </div>
    <div class="ctl" id="model2wrap" hidden>
      <label for="modelsel2">Compare with</label>
      <select id="modelsel2"></select>
    </div>
    <div class="ctl">
      <label>Variable</label>
      <div class="tabs" id="vartabs"></div>
    </div>
    <div class="ctl">
      <label>View</label>
      <div class="tabs" id="viewtabs">
        <button data-kind="forecast" class="on">Forecast</button>
        <button data-kind="error">Error</button>
      </div>
    </div>
    <div class="ctl" id="basewrap">
      <label>Basemap</label>
      <div class="tabs" id="basetabs"></div>
    </div>
    <div class="ctl" id="opacwrap" hidden>
      <label for="opac">Field opacity <span id="opacval"></span></label>
      <input type="range" id="opac" min="0.2" max="1" step="0.02">
    </div>
    <div class="ctl">
      <label>Colour scale</label>
      <div class="tabs" id="scaletabs">
        <button data-scale="global" class="on" title="One scale for the whole globe — comparable across leads and models">Global</button>
        <button data-scale="stretch" title="Rescale to the 2nd–98th percentile of what is on screen">Stretch to view</button>
      </div>
    </div>
    <div class="ctl">
      <label>Units</label>
      <div class="tabs" id="unittabs">
        <button data-units="metric">Metric</button>
        <button data-units="imperial">Imperial</button>
      </div>
    </div>
    <div class="ctl">
      <label>Layout</label>
      <div class="tabs" id="paneltabs">
        <button data-panes="1" class="on">Single</button>
        <button data-panes="2">Side by side</button>
      </div>
    </div>
    <div class="ctl">
      <label for="initsel">Init time</label>
      <select id="initsel"></select>
    </div>
    <div class="prov" id="prov"></div>
  </aside>

  <div class="float bottombar">
    <span class="leadlabel" id="leadlabel"></span>
    <input type="range" id="leadslider" min="0" max="0" step="1" value="0" aria-label="lead time">
    <div class="cbar">
      <div>
        <div class="bar" id="cbar"></div>
        <div class="ticks" id="cbarticks"></div>
      </div>
      <span class="unit" id="cbarunit"></span>
    </div>
    <span class="readout" id="readout"></span>
  </div>

  <div class="float attrib" id="attrib" hidden></div>
</div>

<script src="lib/vendor/leaflet.js"></script>
<script type="module" src="lib/js/map.js"></script>
