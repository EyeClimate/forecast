<meta charset="utf-8">
<title>Forecast Map — AI Weather Model Verification</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="lib/vendor/leaflet.css">
<link rel="stylesheet" href="lib/css/site.css">
<style id="model-colors">
/* generated from config.yaml `display.models` by scoreboard/publish.py */
:root {
  --s-aurora: #2a78d6;
  --s-fuxi: #008300;
  --s-atlas: #e87ba4;
  --s-ref: #848d9b;
  --s-fengwu: #eda100;
  --s-pangu6: #4a3aa7;
  --s-sfno: #eb6834;
  --s-fcn3: #1baf7a;
  --s-graphcast: #b23bbf;
  --s-aifs: #96751a;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    --s-aurora: #3987e5;
    --s-fuxi: #008300;
    --s-atlas: #d55181;
    --s-ref: #7d8694;
    --s-fengwu: #c98500;
    --s-pangu6: #9085e9;
    --s-sfno: #d95926;
    --s-fcn3: #199e70;
    --s-graphcast: #c46cd0;
    --s-aifs: #a8892c;
  }
}
:root[data-theme="dark"] {
  --s-aurora: #3987e5;
  --s-fuxi: #008300;
  --s-atlas: #d55181;
  --s-ref: #7d8694;
  --s-fengwu: #c98500;
  --s-pangu6: #9085e9;
  --s-sfno: #d95926;
  --s-fcn3: #199e70;
  --s-graphcast: #c46cd0;
  --s-aifs: #a8892c;
}
</style>
<style>
/* ---------- full-bleed map shell ----------
   The map is the page, not a figure inside one: everything else floats over it.
   That is the whole difference between "a site with a map on it" and a map
   application, and it is why the controls are a panel rather than a form. */
html, body { height: 100%; margin: 0; overflow: hidden; }
.app { position: fixed; inset: 0; display: flex; flex-direction: column; }

.maprow { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr; }
.maprow.two { grid-template-columns: 1fr 1fr; gap: 2px; background: var(--border); }
.pane { position: relative; overflow: hidden; }
.leafletmap { position: absolute; inset: 0; background: var(--page); }
.leaflet-container { background: var(--page); font: inherit; }
/* Geography weight order: coast > border > graticule. All three are drawn over
   a saturated field with nothing behind them, so weight is the only thing
   separating them — if the graticule reads as strongly as the coastline, the
   land/sea edge stops being findable at a glance. */
.coast { fill: none; stroke: var(--ink); stroke-width: .9; opacity: .55; }
.border { fill: none; stroke: var(--ink); stroke-width: .6; opacity: .3;
  stroke-dasharray: 4 3; }
.grat { fill: none; stroke: var(--ink); stroke-width: .5; opacity: .12; }

/* City markers sit directly on the field, so the name needs a halo: paint-order
   puts the stroke behind the fill, giving an outline that keeps the glyph
   readable over both the pale and the dark end of any ramp.

   The icon itself takes no pointer events — it is a zero-size anchor and a wide
   invisible box over the map would eat drags. The dot and the name opt back in,
   because those are the click target. */
.citylabel { pointer-events: none; }
.citylabel .dot, .citylabel span { pointer-events: auto; cursor: pointer; }
.citylabel span {
  position: absolute; left: 9px; top: -8px; white-space: nowrap;
  font-size: 11px; font-weight: 650; letter-spacing: .01em;
  color: var(--ink);
  paint-order: stroke fill;
  -webkit-text-stroke: 2.5px color-mix(in srgb, var(--page) 78%, transparent);
  display: none;                       /* .zoomed turns them on; see below */
}
/* A ring rather than the old 3px pip. These are now the affordance for "this
   place has a per-model series", so they have to look clickable and be big
   enough to hit — 3px was neither. */
.citylabel .dot {
  position: absolute; left: -5px; top: -5px; width: 10px; height: 10px;
  border-radius: 50%; box-sizing: border-box;
  border: 2px solid color-mix(in srgb, var(--page) 82%, transparent);
  background: var(--ink); opacity: .7;
  transition: opacity .12s, transform .12s;
}
.citylabel .dot:hover { opacity: 1; transform: scale(1.25); }
/* Names appear once the reader has zoomed in far enough to be asking "where
   exactly is this", and never under a basemap, which prints its own. */
.leaflet-container.zoomed:not(.basemap-on) .citylabel span { display: block; }

/* ---------- popups ---------- */
.mappop .leaflet-popup-content-wrapper {
  background-color: var(--glass-bg); background-image: var(--glass-sheen);
  color: var(--ink); border: 1px solid var(--glass-edge); border-radius: 14px;
  box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-rim);
  backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
}
/* The tip is a rotated square, so a backdrop-filter on it would blur along the
   rotated axes and shear the field behind the beak. Left as flat fill. */
.mappop .leaflet-popup-tip {
  background: var(--glass-bg); border: 1px solid var(--glass-edge); box-shadow: none;
}
.mappop .leaflet-popup-content { margin: 11px 13px; font: inherit; line-height: 1.4; }
.mappop a.leaflet-popup-close-button { color: var(--muted); }
.pophead b { display: block; font-size: 13.5px; font-weight: 650; }
.pophead span { display: block; font-size: 11px; color: var(--muted); margin-bottom: 7px; }
.poptbl { border-collapse: collapse; width: 100%; font-size: 12.5px; }
.poptbl td { padding: 2px 0; white-space: nowrap; }
.poptbl td.name { padding-right: 12px; }
/* Values and errors are read down the column and compared, so they are
   monospaced and right-aligned — a proportional column of numbers cannot be
   scanned for magnitude. */
.poptbl td.val, .poptbl td.err {
  text-align: right; font-family: var(--mono); font-size: 11.5px;
}
.poptbl td.err { padding-left: 10px; color: var(--muted); }
.poptbl tr.truth td { font-weight: 650; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
.poptbl tr.truth + tr td { padding-top: 5px; }
.poptbl .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
.popfoot { font-size: 11px; color: var(--muted); margin-top: 7px; line-height: 1.45; }
.popfoot a { color: var(--accent-ink); font-weight: 600; text-decoration: none; }
.popfoot a:hover { text-decoration: underline; }

/* Basemap credit. Shown and hidden with the layer that requires it, so it is
   never an empty box at global zoom.

   Page chrome rather than Leaflet's own attribution control, and positioned by
   elimination: the bottom bar owns everything left of right:292px, the control
   panel owns the top right, and the pane labels sit at bottom:92px of each pane.
   That leaves the strip between the bottom bar's right edge and the zoom
   control. check_map_render.js asserts it stays clear of all four.

   That strip is exactly 246px wide (292px of bottom bar less the 46px the zoom
   control occupies), so the width is capped below it rather than left to the
   length of whatever credit string config carries. */
.attrib { right: 52px; bottom: 14px; max-width: 224px; padding: 4px 9px;
  font-size: 10.5px; line-height: 1.35; color: var(--muted); }
.attrib a { color: var(--ink-2); }
.attrib[hidden] { display: none; }

/* Leaflet's own chrome is an opaque white box with a hard border. Restyled
   rather than left alone: one solid control beside five glass ones does not
   read as a deliberate exception, it reads as the one thing that was missed. */
.leaflet-control-zoom { border: none !important; border-radius: 12px; overflow: hidden;
  box-shadow: var(--glass-shadow) !important; }
.leaflet-control-zoom a {
  background-color: var(--glass-bg) !important; background-image: var(--glass-sheen);
  color: var(--ink) !important; border-bottom: 1px solid var(--glass-edge) !important;
  backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
  font-weight: 500;
}
.leaflet-control-zoom a:first-child { box-shadow: inset 0 1px 0 var(--glass-rim); }
.leaflet-control-zoom a:last-child { border-bottom: none !important; }
.leaflet-control-zoom a:hover { background-color: color-mix(in srgb, var(--surface) 78%, transparent) !important; }

#opacwrap input[type=range] { width: 100%; accent-color: var(--accent); }
#opacval { color: var(--ink-2); font-family: var(--mono); text-transform: none;
  letter-spacing: 0; margin-left: 4px; }

/* ---------- floating chrome: glass ----------
 *
 * Every panel on this page floats over a saturated data field, which is what
 * makes the material worth getting right and also what constrains it. Four
 * things together read as glass rather than as a translucent box:
 *
 *   1. blur, so the field behind reads as *behind* rather than as texture
 *      showing through;
 *   2. saturate(), because blurring alone washes colour out and the result
 *      looks like fog — the lift back to 180% is what makes it feel refractive;
 *   3. a bright inset rim along the top edge, which is the specular highlight
 *      that gives the slab thickness. Without it the panel is a flat cut-out;
 *   4. a top-down sheen, a little brighter than the rim and fading by 45%, so
 *      light appears to come from one direction.
 *
 * The 78% is the one number here that is not a free aesthetic choice, and it is
 * higher than it would be on a photograph. This is a verification site: the
 * colourbar is a legend, the readout is a measurement, and both sit on glass
 * over a field that can be any colour the ramp contains. It was chosen by
 * compositing the page over the hot end of the t2m ramp at five viewports and
 * measuring WCAG contrast on the result, not by eye — at 58% the panel's
 * micro-labels came out at 1.9:1 in dark mode and the nav links at 3.4:1.
 *
 * saturate() is 150% rather than the 180% that reads best on photographs, for
 * the same reason: it boosts the field's chroma *before* compositing, and the
 * text has to survive what comes out.
 *
 * check_map_render.js section 13 measures this the same way, so thinning the
 * glass fails a gate instead of quietly costing legibility.
 */
:root {
  --glass-bg: color-mix(in srgb, var(--surface) 78%, transparent);
  --glass-edge: color-mix(in srgb, var(--ink) 10%, transparent);
  --glass-rim: rgba(255, 255, 255, .60);
  --glass-sheen: linear-gradient(180deg, rgba(255,255,255,.20), rgba(255,255,255,0) 45%);
  --glass-blur: blur(24px) saturate(150%);
  --glass-shadow: 0 1px 1px rgba(16,21,28,.05), 0 10px 30px rgba(16,21,28,.13);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    /* The rim drops from .60 to .14: the same highlight that reads as a lit
       edge on a light surface reads as a glowing outline on a dark one. */
    --glass-rim: rgba(255, 255, 255, .14);
    --glass-sheen: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,0) 45%);
    --glass-edge: color-mix(in srgb, var(--ink) 14%, transparent);
    --glass-shadow: 0 1px 1px rgba(0,0,0,.30), 0 12px 34px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"] {
  --glass-rim: rgba(255, 255, 255, .14);
  --glass-sheen: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,0) 45%);
  --glass-edge: color-mix(in srgb, var(--ink) 14%, transparent);
  --glass-shadow: 0 1px 1px rgba(0,0,0,.30), 0 12px 34px rgba(0,0,0,.45);
}

.float, .glass {
  background-color: var(--glass-bg);
  background-image: var(--glass-sheen);
  border: 1px solid var(--glass-edge);
  border-radius: 14px;
  box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-rim);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
}
.float { position: absolute; z-index: 1000; }

/* Secondary text needs more weight on glass than it does on an opaque surface.
   --muted is tuned in site.css against a flat --surface; composited over a
   saturated field at 78% it measured 2.7:1, which is not a legible label. These
   are scoped to the glass containers rather than changed in site.css, because
   the token is correct everywhere it is used on a solid background — index.html
   and compare.html must not shift. Values chosen to clear 4.5:1 against the
   worst backdrop the t2m ramp produces, measured, not guessed. */
.float, .note, .mappop .leaflet-popup-content-wrapper { --muted: #5a6472; }
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) .float,
  :root:where(:not([data-theme="light"])) .note,
  :root:where(:not([data-theme="light"])) .mappop .leaflet-popup-content-wrapper { --muted: #a3adba; }
}
:root[data-theme="dark"] .float,
:root[data-theme="dark"] .note,
:root[data-theme="dark"] .mappop .leaflet-popup-content-wrapper { --muted: #a3adba; }

/* Transparency is a preference, not a given. Where the reader has asked for
   less of it — or for more contrast — the material becomes an opaque panel and
   keeps only the shadow that separates it from the map. The blur goes too: it
   costs compositing work for an effect that is no longer visible. */
@media (prefers-reduced-transparency: reduce), (prefers-contrast: more) {
  :root {
    --glass-bg: var(--surface);
    --glass-sheen: none;
    --glass-rim: transparent;
    --glass-edge: var(--border);
  }
  .float, .glass, .note, .mappop .leaflet-popup-content-wrapper,
  .leaflet-control-zoom a {
    backdrop-filter: none !important;
    -webkit-backdrop-filter: none !important;
  }
}

.topbar { top: 12px; left: 12px; display: flex; align-items: center; gap: 4px; padding: 6px 8px; }
.topbar a { color: var(--ink-2); text-decoration: none; font-weight: 600; font-size: 13px;
  padding: 5px 10px; border-radius: 8px; }
.topbar a.on { background: var(--accent-wash); color: var(--accent-ink); }
.topbar a:hover { color: var(--ink); }
.topbar .brand { font-weight: 700; color: var(--ink); font-size: 13px; padding: 5px 10px 5px 6px;
  border-right: 1px solid var(--border); margin-right: 4px; }

.ctlpanel { top: 12px; right: 12px; width: 268px; max-height: calc(100% - 140px); overflow-y: auto; padding: 14px; }
.ctlpanel h2 { margin: 0 0 12px; font-size: 13px; letter-spacing: .04em; text-transform: uppercase;
  color: var(--muted); font-weight: 700;
  display: flex; align-items: center; justify-content: space-between; gap: 8px; }

/* ---------- minimise ----------
   The panel is 348px of chrome over the one thing the page exists to show, and
   wanting it out of the way is not a narrow-screen problem — it is a "let me
   look at the Pacific" problem. The affordance lives on the panel and the way
   back lives in the same corner, so nothing has to be hunted for.

   Below 820px the nav's Layers button already does this, so the pill stands
   down there rather than offering the reader two controls for one job. */
.panelmin { flex: none; display: grid; place-items: center;
  width: 22px; height: 22px; margin: -3px -3px -3px 0; padding: 0;
  border: 0; border-radius: 7px; background: none; cursor: pointer; color: var(--muted); }
.panelmin:hover { background: var(--accent-wash); color: var(--accent-ink); }
.panelpill { top: 12px; right: 12px; display: flex; align-items: center; gap: 7px;
  padding: 8px 13px 8px 10px; font: inherit; font-size: 12.5px; font-weight: 600;
  color: var(--ink-2); cursor: pointer; }
.panelpill:hover { color: var(--ink); }
.panelpill[hidden] { display: none; }
/* Same CSS triangle idiom as the disclosure markers, so the two read as the
   same family of control rather than as two unrelated arrows. */
.chev { width: 0; height: 0; border: 4px solid transparent; border-left-color: currentColor;
  transform: translateX(1px); }
.chev.back { border-left-color: transparent; border-right-color: currentColor;
  transform: translateX(-1px); }
.ctl { margin-bottom: 13px; }
/* Sentence case, not the uppercase micro-label this panel used to use. Ten
   uppercase tracked-out labels stacked vertically read as ten headings of equal
   importance, which is most of why the panel felt like a wall — and tracking
   costs real width in a 268px column. The panel heading stays uppercase; it is
   the only thing here that IS a heading. */
.ctl > label { display: block; font-size: 11px; color: var(--muted);
  font-weight: 600; margin-bottom: 5px; }

/* ---------- second-tier disclosures ---------- */
.fold { border-top: 1px solid var(--border); padding-top: 9px; margin-top: 3px; }
.fold + .fold { margin-top: 0; }
.fold > summary { cursor: pointer; list-style: none; user-select: none;
  display: flex; align-items: baseline; gap: 7px; padding: 3px 0 9px;
  font-size: 12px; font-weight: 650; color: var(--ink-2); }
.fold > summary::-webkit-details-marker { display: none; }
/* The triangle is drawn rather than inherited so it can sit at a fixed size and
   rotate; the native marker differs per browser and cannot be positioned. */
.fold > summary::before {
  content: ""; flex: none; width: 0; height: 0; margin-right: 1px;
  border: 4px solid transparent; border-left-color: var(--muted);
  transform: translateY(-1px); transition: transform .15s;
}
.fold[open] > summary::before { transform: translateY(1px) rotate(90deg); }
.fold > summary:hover { color: var(--ink); }
/* The state a collapsed section is hiding, shown on its own summary. Without it
   the panel would answer "what units am I in?" only by being opened. */
.foldsum { margin-left: auto; font-weight: 500; font-size: 11px; color: var(--muted);
  font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fold .prov { border-top: none; padding-top: 0; margin-top: 0; }
.ctl select { font: inherit; font-size: 13.5px; padding: 7px 9px; border-radius: 8px; width: 100%;
  border: 1px solid var(--border); background: var(--surface); color: var(--ink); }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; }
.tabs button { font: inherit; font-size: 12.5px; cursor: pointer; border: 1px solid var(--border);
  background: var(--surface); color: var(--ink-2); padding: 5px 10px; border-radius: 8px; flex: 1 1 auto; }
.tabs button.on { background: var(--accent-wash); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.prov { font-size: 11.5px; color: var(--muted); line-height: 1.5; border-top: 1px solid var(--border);
  padding-top: 10px; margin-top: 2px; }
.prov span { display: block; }
.prov b { color: var(--ink-2); font-weight: 600; }

.panelbtn { display: none; }
/* Bottom-centre of each pane. The top edge belongs to the nav (left) and the
   control panel (right); at a 1280px viewport in side-by-side each pane is only
   640px, so both a corner-anchored and a top-centred tag still land underneath
   them — the left pane was silently unlabelled. Nothing errors when absolutely
   positioned chrome collides, it just disappears.

   The offset is measured, not fixed at 92px, because the bottom bar's height is
   not a constant: below ~520px it wraps to two and then three rows and grows
   upward until it swallows a label sitting at a fixed offset. map.js publishes
   the bar's height as --barh and updates it from a ResizeObserver. The 64px
   fallback is the bar's height on a wide viewport, so the pre-measurement paint
   lands where the old constant put it. */
.paneltag { position: absolute; bottom: calc(var(--barh, 64px) + 28px);
  left: 50%; transform: translateX(-50%);
  z-index: 900; font-size: 12.5px; font-weight: 600; white-space: nowrap;
  display: flex; align-items: center; gap: 7px; padding: 6px 11px; }
.paneltag .sw { width: 9px; height: 9px; border-radius: 3px; flex: none; }

.bottombar { left: 12px; bottom: 12px; right: 292px; padding: 11px 14px; display: flex;
  align-items: center; gap: 14px; flex-wrap: wrap; }
.bottombar input[type=range] { flex: 1; min-width: 160px; accent-color: var(--accent); }
.leadlabel { font-family: var(--mono); font-size: 12.5px; color: var(--ink); white-space: nowrap; }

/* 210px, not 150: converting to °C put a decimal point on every tick, and five
   of those do not fit in 150px without touching. */
.cbar { display: flex; align-items: center; gap: 9px; }
.cbar .bar { height: 10px; width: 210px; border-radius: 3px; border: 1px solid var(--border); }
/* --ink-2, not --muted: these are the values the entire field is read against.
   They were the faintest text on the page, which is backwards, and over a
   saturated field on glass they measured 2.3:1. */
.cbar .ticks { display: flex; justify-content: space-between; width: 210px; font-size: 10px;
  color: var(--ink-2); font-family: var(--mono); }
.cbar .unit { font-size: 11px; color: var(--ink-2); max-width: 190px; }
.readout { font-family: var(--mono); font-size: 12px; color: var(--ink-2); white-space: nowrap; min-width: 150px; }

.notes { position: absolute; z-index: 1000; left: 12px; top: 62px; max-width: 420px; }
.note { font-size: 12.5px; color: var(--ink-2);
  background-color: var(--glass-bg); background-image: var(--glass-sheen);
  border: 1px solid var(--glass-edge); border-left: 3px solid var(--accent);
  border-radius: 0 12px 12px 0; padding: 9px 13px;
  box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-rim);
  backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); }

/* Fatal-error card. Centred rather than tucked in the .notes stack: if this is
   showing, there is no map behind it to avoid covering. */
.fatal { top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1100;
  max-width: 460px; padding: 20px 24px; text-align: center; }
.fatal h3 { margin: 0 0 8px; font-size: 15px; font-weight: 650; }
.fatal p { margin: 0; font-size: 13px; color: var(--ink-2); }
.fatal code { font-family: var(--mono); font-size: 12px; color: var(--accent-ink); }

@media (max-width: 820px) {
  /* The nav is 516px whatever the viewport, so below ~530px it ran off the
     right edge — taking the Layers button with it, which is the only way to
     close the panel. A panel you cannot dismiss on a phone is the whole of
     "it doesn't work when I make the window narrow". Let it wrap instead, and
     bound it to the viewport so it cannot overflow at any width. */
  .topbar { right: 12px; flex-wrap: wrap; }

  /* A drawer under the nav, not a slab clipped at 46% of the viewport. The old
     cap cut the panel through the middle of a control — and because it was a
     percentage it got shorter exactly when the content had least room. Bounded
     by what is actually there instead: the nav above, the bottom bar below. */
  .ctlpanel { left: 12px; right: 12px; width: auto;
    top: calc(var(--navh, 44px) + 18px);
    max-height: calc(100% - var(--navh, 44px) - var(--barh, 64px) - 46px); }
  .ctlpanel[hidden] { display: none; }
  .notes { top: calc(var(--navh, 44px) + 18px); }
  .panelbtn { display: inline-block; }
  .panelpill { display: none !important; }   /* the nav's Layers button covers it */
  .bottombar { right: 12px; }
  .maprow.two { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
  /* The bottom edge is entirely spoken for here: the bar goes full width and
     wraps to two or three rows, swallowing the strip the wide layout uses. The
     nav is no better — it is 516px regardless of viewport, so beside it there is
     nothing left below 780px. That leaves the band directly under the nav.

     It shares that band with the notes stack and, when the reader opens it, the
     control panel — which at this width covers the whole upper map by design,
     notes and pane labels included. So the gate checks this against the nav, the
     bar, the pane labels and the zoom control, and not against those two. */
  .attrib { top: calc(var(--navh, 44px) + 44px); right: 12px; bottom: auto;
    max-width: 250px; text-align: right; }
}
/* The brand is 150px of a nav that has none to spare once it has wrapped. The
   page title is still in the document title and the Map tab is still marked
   current, so nothing is lost but the repetition. */
@media (max-width: 520px) {
  .topbar .brand { display: none; }
}
</style>

<div class="app">
  <div class="maprow" id="maprow">
    <div class="pane">
      <div class="leafletmap" id="map1"></div>
      <div class="float paneltag" id="t1"></div>
    </div>
    <div class="pane" id="panel2" hidden>
      <div class="leafletmap" id="map2"></div>
      <div class="float paneltag" id="t2"></div>
    </div>
  </div>

  <nav class="float topbar">
    <span class="brand">Forecast Scoreboard</span>
    <a href="index.html">Leaderboard</a>
    <a href="compare.html">Compare</a>
    <a href="map.html" class="on" aria-current="page">Map</a>
    <button class="panelbtn tabs" id="panelbtn" style="margin-left:4px">Layers</button>
  </nav>

  <div class="notes" id="notes"></div>
  <div class="float fatal" id="fatal" hidden></div>

  <aside class="float ctlpanel" id="ctlpanel">
    <h2>Layer
      <button class="panelmin" id="panelmin" aria-controls="ctlpanel"
              aria-expanded="true" title="Minimise the layer panel">
        <i class="chev"></i>
      </button>
    </h2>
    <div class="ctl">
      <label for="modelsel">Model</label>
      <select id="modelsel"></select>
    </div>
    <div class="ctl" id="model2wrap" hidden>
      <label for="modelsel2">Compare with</label>
      <select id="modelsel2"></select>
    </div>
    <div class="ctl" id="varwrap">
      <label>Variable</label>
      <div class="tabs" id="vartabs"></div>
    </div>
    <div class="ctl">
      <label>View</label>
      <div class="tabs" id="viewtabs">
        <button data-kind="forecast" class="on">Forecast</button>
        <button data-kind="error">Error</button>
      </div>
    </div>
    <div class="ctl">
      <label for="initsel">Init time</label>
      <select id="initsel"></select>
    </div>

    <!-- Second tier. The split is by how often a control is touched, not by
         what it does: model, view and init are the question being asked and
         change constantly; everything below is a preference set once and left.
         Flattening the two into one list is what made this panel 725px tall —
         81% of a 1440x900 window, and already scrolling on a 1280x800 laptop.

         <details> rather than a scripted accordion: it is open/closed state the
         browser already owns, it is keyboard- and screen-reader-correct for
         free, and querySelector still finds the controls inside a closed one,
         which is what lets the render gate drive them without opening it. -->
    <details class="fold" id="dispfold">
      <summary>Display <span class="foldsum" id="dispsum"></span></summary>
    <div class="ctl" id="basewrap">
      <label>Basemap</label>
      <div class="tabs" id="basetabs"></div>
    </div>
    <div class="ctl" id="opacwrap" hidden>
      <label for="opac">Field opacity <span id="opacval"></span></label>
      <input type="range" id="opac" min="0.2" max="1" step="0.02">
    </div>
    <div class="ctl">
      <label>Colour scale</label>
      <div class="tabs" id="scaletabs">
        <button data-scale="global" class="on" title="One scale for the whole globe — comparable across leads and models">Global</button>
        <button data-scale="stretch" title="Rescale to the 2nd–98th percentile of what is on screen">Stretch to view</button>
      </div>
    </div>
    <div class="ctl">
      <label>Units</label>
      <div class="tabs" id="unittabs">
        <button data-units="metric">Metric</button>
        <button data-units="imperial">Imperial</button>
      </div>
    </div>
    <div class="ctl">
      <label>Layout</label>
      <div class="tabs" id="paneltabs">
        <button data-panes="1" class="on">Single</button>
        <button data-panes="2">Side by side</button>
      </div>
    </div>
    </details>

    <details class="fold" id="provfold">
      <summary>This init</summary>
      <div class="prov" id="prov"></div>
    </details>
  </aside>

  <!-- What the panel minimises to. Deliberately in the corner the panel itself
       occupies: a control that collapses somewhere and reopens somewhere else
       makes the reader hunt for it. -->
  <button class="float panelpill" id="panelpill" aria-controls="ctlpanel"
          aria-expanded="false" title="Show the layer panel" hidden>
    <i class="chev back"></i>Layers
  </button>

  <div class="float bottombar">
    <span class="leadlabel" id="leadlabel"></span>
    <input type="range" id="leadslider" min="0" max="0" step="1" value="0" aria-label="lead time">
    <div class="cbar">
      <div>
        <div class="bar" id="cbar"></div>
        <div class="ticks" id="cbarticks"></div>
      </div>
      <span class="unit" id="cbarunit"></span>
    </div>
    <span class="readout" id="readout"></span>
  </div>

  <div class="float attrib" id="attrib" hidden></div>
</div>

<script src="lib/vendor/leaflet.js"></script>
<script type="module" src="lib/js/map.js"></script>
