<meta charset="utf-8">
<title>Forecast Map — AI Weather Model Verification</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="lib/vendor/leaflet.css">
<link rel="stylesheet" href="lib/css/site.css">
<style id="model-colors">
/* generated from config.yaml `display.models` by scoreboard/publish.py */
:root {
  --s-aurora: #2a78d6;
  --s-fuxi: #008300;
  --s-atlas: #e87ba4;
  --s-ref: #848d9b;
  --s-fengwu: #eda100;
  --s-pangu6: #4a3aa7;
  --s-sfno: #eb6834;
  --s-fcn3: #1baf7a;
  --s-graphcast: #b23bbf;
  --s-aifs: #96751a;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    --s-aurora: #3987e5;
    --s-fuxi: #008300;
    --s-atlas: #d55181;
    --s-ref: #7d8694;
    --s-fengwu: #c98500;
    --s-pangu6: #9085e9;
    --s-sfno: #d95926;
    --s-fcn3: #199e70;
    --s-graphcast: #c46cd0;
    --s-aifs: #a8892c;
  }
}
:root[data-theme="dark"] {
  --s-aurora: #3987e5;
  --s-fuxi: #008300;
  --s-atlas: #d55181;
  --s-ref: #7d8694;
  --s-fengwu: #c98500;
  --s-pangu6: #9085e9;
  --s-sfno: #d95926;
  --s-fcn3: #199e70;
  --s-graphcast: #c46cd0;
  --s-aifs: #a8892c;
}
</style>
<style>
/* ---------- full-bleed map shell ----------
   The map is the page, not a figure inside one: everything else floats over it.
   That is the whole difference between "a site with a map on it" and a map
   application, and it is why the controls are a panel rather than a form. */
html, body { height: 100%; margin: 0; overflow: hidden; }
.app { position: fixed; inset: 0; display: flex; flex-direction: column; }

.maprow { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr; }
.maprow.two { grid-template-columns: 1fr 1fr; gap: 2px; background: var(--border); }
.pane { position: relative; overflow: hidden; }
.leafletmap { position: absolute; inset: 0; background: var(--page); }
.leaflet-container { background: var(--page); font: inherit; }
.coast { fill: none; stroke: var(--ink); stroke-width: .8; opacity: .5; }

/* floating chrome */
.float { position: absolute; z-index: 1000; background: color-mix(in srgb, var(--surface) 92%, transparent);
  border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow);
  backdrop-filter: blur(10px); }

.topbar { top: 12px; left: 12px; display: flex; align-items: center; gap: 4px; padding: 6px 8px; }
.topbar a { color: var(--ink-2); text-decoration: none; font-weight: 600; font-size: 13px;
  padding: 5px 10px; border-radius: 8px; }
.topbar a.on { background: var(--accent-wash); color: var(--accent-ink); }
.topbar a:hover { color: var(--ink); }
.topbar .brand { font-weight: 700; color: var(--ink); font-size: 13px; padding: 5px 10px 5px 6px;
  border-right: 1px solid var(--border); margin-right: 4px; }

.ctlpanel { top: 12px; right: 12px; width: 268px; max-height: calc(100% - 140px); overflow-y: auto; padding: 14px; }
.ctlpanel h2 { margin: 0 0 12px; font-size: 13px; letter-spacing: .04em; text-transform: uppercase;
  color: var(--muted); font-weight: 700; }
.ctl { margin-bottom: 13px; }
.ctl > label { display: block; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase;
  color: var(--muted); font-weight: 700; margin-bottom: 5px; }
.ctl select { font: inherit; font-size: 13.5px; padding: 7px 9px; border-radius: 8px; width: 100%;
  border: 1px solid var(--border); background: var(--surface); color: var(--ink); }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; }
.tabs button { font: inherit; font-size: 12.5px; cursor: pointer; border: 1px solid var(--border);
  background: var(--surface); color: var(--ink-2); padding: 5px 10px; border-radius: 8px; flex: 1 1 auto; }
.tabs button.on { background: var(--accent-wash); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.prov { font-size: 11.5px; color: var(--muted); line-height: 1.5; border-top: 1px solid var(--border);
  padding-top: 10px; margin-top: 2px; }
.prov span { display: block; }
.prov b { color: var(--ink-2); font-weight: 600; }

.panelbtn { display: none; }
/* Bottom-centre of each pane. The top edge belongs to the nav (left) and the
   control panel (right); at a 1280px viewport in side-by-side each pane is only
   640px, so both a corner-anchored and a top-centred tag still land underneath
   them — the left pane was silently unlabelled. Nothing errors when absolutely
   positioned chrome collides, it just disappears. */
.paneltag { position: absolute; bottom: 92px; left: 50%; transform: translateX(-50%);
  z-index: 900; font-size: 12.5px; font-weight: 600; white-space: nowrap;
  display: flex; align-items: center; gap: 7px; padding: 6px 11px; }
.paneltag .sw { width: 9px; height: 9px; border-radius: 3px; flex: none; }

.bottombar { left: 12px; bottom: 12px; right: 292px; padding: 11px 14px; display: flex;
  align-items: center; gap: 14px; flex-wrap: wrap; }
.bottombar input[type=range] { flex: 1; min-width: 160px; accent-color: var(--accent); }
.leadlabel { font-family: var(--mono); font-size: 12.5px; color: var(--ink); white-space: nowrap; }

.cbar { display: flex; align-items: center; gap: 9px; }
.cbar .bar { height: 10px; width: 150px; border-radius: 3px; border: 1px solid var(--border); }
.cbar .ticks { display: flex; justify-content: space-between; width: 150px; font-size: 10px;
  color: var(--muted); font-family: var(--mono); }
.cbar .unit { font-size: 11px; color: var(--ink-2); max-width: 190px; }
.readout { font-family: var(--mono); font-size: 12px; color: var(--ink-2); white-space: nowrap; min-width: 150px; }

.notes { position: absolute; z-index: 1000; left: 12px; top: 62px; max-width: 420px; }
.note { font-size: 12.5px; color: var(--ink-2); background: color-mix(in srgb, var(--surface) 94%, transparent);
  border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 0 10px 10px 0;
  padding: 9px 13px; box-shadow: var(--shadow); backdrop-filter: blur(10px); }
.empty { color: var(--muted); padding: 60px 20px; text-align: center; }

@media (max-width: 820px) {
  .ctlpanel { left: 12px; right: 12px; width: auto; top: 62px; max-height: 46%; }
  .ctlpanel[hidden] { display: none; }
  .panelbtn { display: inline-block; }
  .bottombar { right: 12px; }
  .maprow.two { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
}
</style>

<div class="app">
  <div class="maprow" id="maprow">
    <div class="pane">
      <div class="leafletmap" id="map1"></div>
      <div class="float paneltag" id="t1"></div>
    </div>
    <div class="pane" id="panel2" hidden>
      <div class="leafletmap" id="map2"></div>
      <div class="float paneltag" id="t2"></div>
    </div>
  </div>

  <nav class="float topbar">
    <span class="brand">Forecast Scoreboard</span>
    <a href="index.html">Leaderboard</a>
    <a href="compare.html">Compare</a>
    <a href="map.html" class="on" aria-current="page">Map</a>
    <button class="panelbtn tabs" id="panelbtn" style="margin-left:4px">Layers</button>
  </nav>

  <div class="notes" id="notes"></div>

  <aside class="float ctlpanel" id="ctlpanel">
    <h2>Layer</h2>
    <div class="ctl">
      <label for="modelsel">Model</label>
      <select id="modelsel"></select>
    </div>
    <div class="ctl" id="model2wrap" hidden>
      <label for="modelsel2">Compare with</label>
      <select id="modelsel2"></select>
    </div>
    <div class="ctl">
      <label>Variable</label>
      <div class="tabs" id="vartabs"></div>
    </div>
    <div class="ctl">
      <label>View</label>
      <div class="tabs" id="viewtabs">
        <button data-kind="forecast" class="on">Forecast</button>
        <button data-kind="error">Error</button>
      </div>
    </div>
    <div class="ctl">
      <label>Layout</label>
      <div class="tabs" id="paneltabs">
        <button data-panes="1" class="on">Single</button>
        <button data-panes="2">Side by side</button>
      </div>
    </div>
    <div class="ctl">
      <label for="initsel">Init time</label>
      <select id="initsel"></select>
    </div>
    <div class="prov" id="prov"></div>
  </aside>

  <div class="float bottombar">
    <span class="leadlabel" id="leadlabel"></span>
    <input type="range" id="leadslider" min="0" max="0" step="1" value="0" aria-label="lead time">
    <div class="cbar">
      <div>
        <div class="bar" id="cbar"></div>
        <div class="ticks" id="cbarticks"></div>
      </div>
      <span class="unit" id="cbarunit"></span>
    </div>
    <span class="readout" id="readout"></span>
  </div>
</div>

<script src="lib/vendor/leaflet.js"></script>
<script type="module" src="lib/js/map.js"></script>
